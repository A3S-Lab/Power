name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Keep cross-build tooling reproducible across source and release workflows.
  CROSS_GIT_REV: "8c1a8aa4b661711f4b7b6ac07c2e8929ce2f7d27"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  clippy:
    name: Clippy (${{ matrix.label }})
    runs-on: ubuntu-latest
    env:
      # Bound Clippy's hosted-runner peak memory. The
      # embedded Candle graph and every test target are checked together.
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: default
            features: ""
          - label: hf+hw-verify
            features: "--features hf,hw-verify"
          - label: picolm
            features: "--no-default-features --features picolm"
          - label: hf-only
            features: "--no-default-features --features hf"
          - label: llamacpp
            features: "--no-default-features --features llamacpp"
            native_deps: true
          - label: tee-minimal
            features: "--no-default-features --features tee-minimal"
            native_deps: true
          - label: embedded-inference
            features: "--no-default-features --features embedded-inference"
          - label: release-promotion
            features: "--no-default-features --features server,embedded-inference,hw-verify"
          - label: artifact-provisioning
            features: "--no-default-features --features artifact-provisioning"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-v2-${{ matrix.label }}
      - name: Install native build dependencies
        if: matrix.native_deps == true
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake
      - name: Run Clippy
        shell: bash
        run: |
          set +e
          log_path="${RUNNER_TEMP}/clippy-${{ matrix.label }}.log"
          cargo clippy --locked --all-targets ${{ matrix.features }} -- -D warnings 2>&1 | tee "$log_path"
          statuses=("${PIPESTATUS[@]}")
          status="${statuses[0]}"
          if [ "$status" -eq 0 ]; then
            status="${statuses[1]}"
          fi
          if [ "$status" -ne 0 ]; then
            annotation="$(tail -n 40 "$log_path")"
            annotation="${annotation//'%'/'%25'}"
            annotation="${annotation//$'\r'/'%0D'}"
            annotation="${annotation//$'\n'/'%0A'}"
            echo "::error title=Clippy (${{ matrix.label }}) failed::$annotation"
          fi
          exit "$status"

  embedded-boundary:
    name: Embedded dependency boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: tools/check-embedded-deps.sh
      - name: Test release evidence commit layout
        run: tools/test-release-evidence-commit.sh
      - name: Test release workflow contract
        run: tools/test-release-workflow-contract.sh
      - name: Test prompt-cache benchmark client
        run: python3 -m unittest tools/test_prompt_cache_benchmark.py
      - name: Test Qwen3.8 quality benchmark contracts
        run: |
          python3 tools/test_qwen38_quality_eval.py
          python3 tools/test_qwen38_quality_evidence.py
          python3 tools/test_dspark_adaptive_evidence.py
          python3 tools/test_dspark_quality_followup_evidence.py
          python3 tools/qwen38_quality_evidence.py verify \
            --evidence docs/benchmarks/qwen3.8-27b-q6k-rtx4090/dspark/quality/evidence.json \
            --json
          python3 tools/dspark_adaptive_evidence.py verify \
            --evidence docs/benchmarks/qwen3.8-27b-q6k-rtx4090/dspark/adaptive/evidence.json \
            --json
          python3 tools/dspark_quality_followup_evidence.py verify \
            --evidence docs/benchmarks/qwen3.8-27b-q6k-rtx4090/dspark/quality/followup-evidence.json \
            --json

  windows-embedded:
    name: Check (windows-embedded-inference)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Enable long paths for Cargo Git dependencies
        run: git config --global core.longpaths true
      - name: Test GGUF benchmark preflight contract
        run: .\tools\test-gguf-speculative-preflight.ps1
      - name: Test external-draft benchmark contract
        run: .\tools\test-llamacpp-external-draft-benchmark.ps1
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-embedded-inference
      - run: cargo check --locked --no-default-features --features embedded-inference --lib
      - run: cargo test --locked --no-default-features --features embedded-inference --lib inference::weights
      - run: cargo test --locked --no-default-features --features embedded-inference --lib inference::storage_benchmark
      - run: cargo test --locked --no-default-features --features embedded-inference --lib positional_demand_and_prefetch_serialize_one_materialization

  macos-embedded:
    name: Check (macos-embedded-inference)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-embedded-inference
      - run: cargo check --locked --no-default-features --features embedded-inference --lib
      - run: cargo test --locked --no-default-features --features embedded-inference --lib inference::weights
      - run: cargo test --locked --no-default-features --features embedded-inference --lib inference::storage_benchmark
      - run: cargo test --locked --no-default-features --features embedded-inference --lib positional_demand_and_prefetch_serialize_one_materialization

  test:
    name: Test (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: default
            args: "--lib"
          # CUDA and Metal are platform/toolchain-specific and cannot be
          # enabled together on an Ubuntu runner. Exercise every Linux CPU
          # feature explicitly instead of using Cargo's --all-features.
          - label: linux-cpu-features
            args: "--no-default-features --features server,llamacpp,mistralrs,embedded-inference,tls,vsock,hf,hw-verify,picolm --lib"
            native_deps: true
          - label: embedded-inference
            args: "--no-default-features --features embedded-inference --lib"
          - label: release-promotion
            args: "--no-default-features --features server,embedded-inference,hw-verify --bin a3s-power-verify"
          - label: artifact-provisioning
            args: "--no-default-features --features artifact-provisioning --lib"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.label }}
      - name: Install native build dependencies
        if: matrix.native_deps == true
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake
      - run: cargo test --locked ${{ matrix.args }}

  package:
    name: Package verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: package-verification
          cache-targets: false
          save-if: false
      - run: cargo package --locked

  cross-build:
    name: Cross (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: cross-${{ matrix.target }}
      - name: Install cross
        if: matrix.use_cross
        run: >-
          cargo install cross --git https://github.com/cross-rs/cross
          --rev "${CROSS_GIT_REV}" --locked
      - name: Build
        run: |
          BUILD_CMD="cargo"
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            BUILD_CMD="cross"
          fi
          $BUILD_CMD build --locked --release --target ${{ matrix.target }} --features hf,hw-verify,embedded-inference
