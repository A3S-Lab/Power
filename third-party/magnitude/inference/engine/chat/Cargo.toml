[package]
publish = false
name = "magnitude-chat"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
magnitude-artifacts = { path = "../artifacts" }
magnitude-generation = { path = "../generation" }
magnitude-grammar = { path = "../grammar" }
magnitude-templates = { path = "../templates" }
getrandom = { version = "0.4.3" }
jsonschema = { version = "=0.58.2", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }
