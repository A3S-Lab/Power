[package]
publish = false
name = "magnitude-engine-cli"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# The low-level `magnitude-engine` binary: one explicit local model, loaded
# in-process, served through the engine's protocol library.
[[bin]]
name = "magnitude-engine"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
futures-util = { version = "0.3.31" }
magnitude-engine = { path = ".." }
magnitude-executor = { path = "../executor" }
magnitude-serving = { path = "../serving" }
magnitude-state = { path = "../state" }
serde_json = { version = "1.0.149" }
tokio = { version = "1.49.0", features = ["rt-multi-thread", "net", "signal"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
