[package]
publish = false
name = "magnitude-harness"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# The evaluation harness: the only in-process driver of the engine. It runs
# fixture sets (specs/26-10-08/evaluation-contracts.md) through the serving
# chat path and the executor, and writes evaluation result records.
[[bin]]
name = "magnitude-harness"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.54", features = ["derive", "env"] }
libc = { version = "0.2.180" }
magnitude-chat = { path = "../../engine/chat" }
# The engine's development tuning tools (pins and the survey), which only the
# harness enables; a served engine is built without them.
magnitude-engine = { path = "../../engine", features = ["pinned-tuning", "tuning-survey"] }
magnitude-executor = { path = "../../engine/executor" }
magnitude-family-contracts = { path = "../../engine/families/contracts" }
magnitude-scheduler = { path = "../../engine/scheduler" }
magnitude-serving = { path = "../../engine/serving" }
magnitude-state = { path = "../../engine/state" }
seismic = { path = "../../seismic/api" }
serde = { version = "=1.0.229", features = ["derive"] }
# Fixture key order is rendered: chat templates print tool schemas in it.
serde_json = { version = "1.0.149", features = ["preserve_order"] }
sha2 = { version = "0.10.9" }
