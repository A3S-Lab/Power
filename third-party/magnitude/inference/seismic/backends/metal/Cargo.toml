[package]
publish = false
name = "seismic-metal"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
seismic-estimator-metal = { path = "../../estimator/metal" }
seismic-ir = { path = "../../ir" }
seismic-estimator = { path = "../../estimator/core" }
seismic-lang = { path = "../../lang" }
seismic-native-target = { path = "../../native-target" }
seismic-compiler = { path = "../../compiler" }
sha2 = "=0.11.0"

[target.'cfg(target_os = "macos")'.dependencies]
# Unoptimized builds otherwise check every message send against the runtime's
# type encoding; the generated Metal bindings are correct by construction.
objc2 = { version = "0.6", features = ["disable-encoding-assertions"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSError", "NSArray", "NSObject", "NSRange", "NSProcessInfo", "NSData"] }
objc2-metal = { version = "0.3", features = ["MTLDevice", "MTLLibrary", "MTLCommandQueue", "MTLCommandBuffer", "MTLCommandEncoder", "MTLComputeCommandEncoder", "MTLBlitCommandEncoder", "MTLComputePipeline", "MTLBuffer", "MTLResource", "MTLTypes", "MTLAllocation", "MTLResidencySet", "MTLPipeline", "MTLCounters", "MTLComputePass", "MTLEvent", "objc2-core-foundation", "block2"] }
libc = "0.2"
