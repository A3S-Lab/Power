[package]
publish = false
name = "magnitude-service-models"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = { version = "1.0.100" }
bytes = { version = "1.12.1" }
clap = { version = "4.5.54", features = ["derive", "env"] }
flate2 = { version = "1.1" }
fs2 = { version = "0.4.3" }
futures-util = { version = "0.3.31" }
getrandom = { version = "0.4.3" }
hf-hub = { version = "1.0.0", features = ["rustls-tls"] }
magnitude-artifacts = { path = "../../engine/artifacts" }
magnitude-service-contracts = { path = "../contracts" }
magnitude-service-utils = { path = "../utils" }
notify = { version = "8.2.0" }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "1.0.149" }
sha2 = { version = "0.10.9" }
same-file = { version = "1.0.6" }
seismic-lang = { path = "../../seismic/lang" }
sha2-state = { package = "sha2", version = "0.11.0" }
thiserror = { version = "2.0.17" }
tokio = { version = "1.49.0", features = ["fs", "io-util", "time"] }
tracing = { version = "0.1.44" }
tempfile = "3.24.0"

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.180" }
