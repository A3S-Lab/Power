[package]
publish = false
name = "magnitude-service-api"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "export-openapi"
path = "src/bin/export-openapi.rs"

[dependencies]
anyhow = { version = "1.0.100" }
axum = { version = "0.8.9", features = ["ws"] }
base64 = { version = "0.22.1" }
futures-util = { version = "0.3.31" }
magnitude-service-contracts = { path = "../contracts", features = ["openapi"] }
magnitude-serving = { path = "../../engine/serving" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "1.0.149" }
thiserror = { version = "2.0.17" }
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tokio-stream = { version = "0.1.18" }
tracing = { version = "0.1.44" }
utoipa = { version = "5.4.0", features = ["axum_extras", "preserve_order"] }

[dev-dependencies]
http-body-util = { version = "0.1.3" }
tokio = { version = "1.49.0", features = ["test-util"] }
tower = { version = "0.5.3", features = ["util"] }
