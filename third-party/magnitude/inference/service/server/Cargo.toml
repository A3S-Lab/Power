[package]
publish = false
name = "magnitude-service-server"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "magnitude-inference"
path = "src/main.rs"

[dependencies]
anyhow = { version = "1.0.100" }
async-trait = { version = "0.1.92" }
axum = { version = "0.8.9" }
clap = { version = "4.5.54", features = ["derive", "env"] }
futures-util = { version = "0.3.31" }
libc = { version = "0.2.180" }
magnitude-artifacts = { path = "../../engine/artifacts" }
magnitude-engine = { path = "../../engine" }
magnitude-executor = { path = "../../engine/executor" }
magnitude-service-api = { path = "../api" }
magnitude-service-contracts = { path = "../contracts" }
magnitude-service-models = { path = "../models" }
magnitude-service-utils = { path = "../utils" }
magnitude-serving = { path = "../../engine/serving" }
opentelemetry = { version = "0.32.0", features = ["logs", "trace"] }
opentelemetry-appender-tracing = { version = "0.32.0" }
opentelemetry-http = { version = "0.32.0", default-features = false, features = ["reqwest-blocking"] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["http-json", "logs", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { version = "0.32.0", features = ["logs", "trace"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking"] }
seismic = { path = "../../seismic/api" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "1.0.149" }
sha2 = { version = "0.10.9" }
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
tokio = { version = "1.49.0", features = ["io-std", "io-util", "process", "time"] }
tower-http = { version = "0.6.11", features = ["trace"] }
tracing = { version = "0.1.44" }
tracing-opentelemetry = { version = "0.33.0", default-features = false }
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }

[[test]]
name = "residency_lifecycle"
harness = false

[dev-dependencies]
flate2 = { version = "1.1" }
hf-hub = { version = "1.0.0", features = ["rustls-tls"] }
http-body-util = { version = "0.1.3" }
tempfile = "3.24.0"
tower = { version = "0.5.3", features = ["util"] }
tokio = { version = "1.49.0", features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
