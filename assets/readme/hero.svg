    <text x="-3" y="84" fill="#f2f3f5" font-size="72" font-weight="720" letter-spacing="-3.4">A3S Power</text>

    <text x="0" y="135" fill="#a4a8b2" font-size="24">Bounded execution for model-owned graphs</text>
    <text x="0" y="169" fill="#a4a8b2" font-size="24">and OpenAI-compatible services.</text>

