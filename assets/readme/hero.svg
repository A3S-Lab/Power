<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="440" viewBox="0 0 1200 440"
     role="img" aria-labelledby="title desc">
  <title id="title">A3S Power — model-neutral, verifiable inference</title>
  <desc id="desc">A3S Power exposes a listener-free embedded library and an optional OpenAI-compatible server over one model-neutral runtime with admission, devices, weights, receipts, and TEE verification.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080d12"/>
      <stop offset="0.72" stop-color="#0d151c"/>
      <stop offset="1" stop-color="#101923"/>
    </linearGradient>
    <linearGradient id="accent" x1="56" y1="80" x2="510" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="440" rx="24" fill="url(#background)"/>
  <path d="M532 34V406" stroke="#263544" stroke-width="2"/>

  <g id="identity" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="58" y="58" fill="#8da0b3"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" font-weight="700" letter-spacing="2.1">A3S / VERIFIABLE INFERENCE RUNTIME</text>
    <text x="58" y="154" fill="#f8fafc" font-size="70" font-weight="760" letter-spacing="-2.6">A3S Power</text>
    <text x="58" y="213" fill="#f8fafc" font-size="29" font-weight="680">Model-neutral at the core.</text>
    <text x="58" y="253" fill="url(#accent)" font-size="29" font-weight="720">Verifiable at the boundary.</text>
    <text x="58" y="302" fill="#94a3b8" font-size="20">Embed reviewed model graphs or run a</text>
    <text x="58" y="330" fill="#94a3b8" font-size="20">TEE-aware OpenAI-compatible service.</text>

    <g transform="translate(58 366)"
       font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
       font-size="16" font-weight="700">
      <rect width="124" height="36" rx="7" fill="#10232a" stroke="#2c7180"/>
      <circle cx="18" cy="18" r="4" fill="#67e8f9"/>
      <text x="31" y="23" fill="#cffafe">RUST CORE</text>

      <rect x="136" width="112" height="36" rx="7" fill="#201d12" stroke="#806b2c"/>
      <circle cx="154" cy="18" r="4" fill="#fbbf24"/>
      <text x="167" y="23" fill="#fef3c7">TEE</text>

      <rect x="260" width="212" height="36" rx="7" fill="#171d27" stroke="#3c4a5b"/>
      <circle cx="278" cy="18" r="4" fill="#94a3b8"/>
      <text x="291" y="23" fill="#e2e8f0">NO MODEL ASSETS</text>
    </g>
  </g>

  <g id="runtime-boundary" transform="translate(560 34)"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <rect width="610" height="372" rx="18" fill="#0b1219" stroke="#334155" stroke-width="2"/>
    <text x="24" y="32" fill="#fbbf24"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" font-weight="700" letter-spacing="1.4">ATTESTED EXECUTION BOUNDARY</text>

    <g id="library" transform="translate(24 58)">
      <rect width="256" height="92" rx="10" fill="#10232a" stroke="#38bdf8" stroke-width="2"/>
      <text x="18" y="29" fill="#7dd3fc" font-size="18" font-weight="700">EMBEDDED LIBRARY</text>
      <text x="18" y="58" fill="#f8fafc" font-size="22" font-weight="700">embedded-inference</text>
      <text x="18" y="80" fill="#94a3b8" font-size="18">no listener · no model topology</text>
    </g>

    <g id="service" transform="translate(330 58)">
      <rect width="256" height="92" rx="10" fill="#201d12" stroke="#f59e0b" stroke-width="2"/>
      <text x="18" y="29" fill="#fcd34d" font-size="18" font-weight="700">OPTIONAL SERVICE</text>
      <text x="18" y="58" fill="#f8fafc" font-size="22" font-weight="700">server</text>
      <text x="18" y="80" fill="#94a3b8" font-size="18">OpenAI API · RA-TLS · vsock</text>
    </g>

    <path d="M152 162V188H286" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M458 162V188H324" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <g id="core" transform="translate(90 200)">
      <rect width="430" height="72" rx="10" fill="#131d2a" stroke="#60a5fa" stroke-width="2"/>
      <text x="215" y="31" text-anchor="middle" fill="#dbeafe" font-size="21" font-weight="700">ONE MODEL-NEUTRAL CORE</text>
      <text x="215" y="56" text-anchor="middle" fill="#93c5fd"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">admission · devices · weights · receipts</text>
    </g>

    <path d="M305 272V298" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <g id="proof" transform="translate(24 310)"
       font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
       font-size="17" font-weight="700">
      <text x="0" y="0" fill="#67e8f9">artifact digest</text>
      <path d="M148 -5H190" stroke="#38bdf8"/>
      <text x="204" y="0" fill="#93c5fd">claims</text>
      <path d="M266 -5H308" stroke="#60a5fa"/>
      <text x="322" y="0" fill="#fcd34d">TEE report</text>
      <path d="M421 -5H463" stroke="#f59e0b"/>
      <text x="477" y="0" fill="#e2e8f0">verify</text>
    </g>

    <text x="24" y="350" fill="#94a3b8"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16">TEE · INTEGRITY · ZEROIZATION · CANCELLATION · PRIVACY</text>
  </g>
</svg>
