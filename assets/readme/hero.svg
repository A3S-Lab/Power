<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">A3S Power - run the model, prove the boundary</title>
  <desc id="desc">A model-neutral Rust inference runtime connecting embedded and OpenAI-compatible entry points to bounded scheduling, accelerator execution, canonical receipts, and independent verification.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#dfe3ea" stroke-width="1"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#2864e8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#14a675"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="#f3f4f7"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="46" y="46" width="1108" height="538" rx="20" fill="#ffffff" stroke="#cfd4dd"/>

  <g transform="translate(92 88)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <rect width="42" height="42" rx="11" fill="#2864e8"/>
    <path d="M10 32 21 9l11 23M14 25c4.5-2.7 9 3.2 15-.3" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="58" y="29" fill="#17181a" font-size="22" font-weight="700">A3S Power</text>
    <text x="0" y="86" fill="#62666f" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16" font-weight="700" letter-spacing="1.7">VERIFIABLE INFERENCE RUNTIME</text>

    <text x="0" y="160" fill="#17181a" font-size="64" font-weight="680" letter-spacing="-3">Run the model.</text>
    <text x="0" y="229" fill="#2864e8" font-size="64" font-weight="680" letter-spacing="-3">Prove the boundary.</text>

    <text x="2" y="278" fill="#62666f" font-size="21">Model-neutral execution, bounded resources,</text>
    <text x="2" y="307" fill="#62666f" font-size="21">and verifier-owned trust - embedded or hosted.</text>

    <g transform="translate(0 342)" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" font-weight="700">
      <rect width="124" height="38" rx="8" fill="#edf3ff" stroke="#b9ccf7"/>
      <circle cx="18" cy="19" r="4" fill="#2864e8"/>
      <text x="31" y="24" fill="#1f51b8">RUST CORE</text>
      <rect x="136" width="92" height="38" rx="8" fill="#ebf8f3" stroke="#a8dbc8"/>
      <circle cx="154" cy="19" r="4" fill="#14a675"/>
      <text x="167" y="24" fill="#0b7c56">TEE</text>
      <rect x="240" width="176" height="38" rx="8" fill="#f7f7f8" stroke="#d9dce2"/>
      <circle cx="258" cy="19" r="4" fill="#62666f"/>
      <text x="271" y="24" fill="#4f535b">MODEL-NEUTRAL</text>
    </g>

    <g transform="translate(0 418)">
      <text x="0" y="0" fill="#17181a" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="23" font-weight="700">175.2089</text>
      <text x="0" y="24" fill="#62666f" font-size="15">steady token/s</text>
      <path d="M143 -24V29" stroke="#e2e4e8"/>
      <text x="168" y="0" fill="#17181a" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="23" font-weight="700">83.228</text>
      <text x="168" y="24" fill="#62666f" font-size="15">request-wide token/s</text>
      <path d="M356 -24V29" stroke="#e2e4e8"/>
      <text x="381" y="0" fill="#14a675" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="23" font-weight="700">900/900</text>
      <text x="381" y="24" fill="#62666f" font-size="15">matrix requests</text>
    </g>
  </g>

  <g transform="translate(704 89)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect width="404" height="452" rx="14" fill="#ffffff" stroke="#aeb5c1"/>
    <path d="M0 48H404" stroke="#d7dbe2"/>
    <circle cx="20" cy="24" r="4" fill="#d8dce3"/>
    <circle cx="34" cy="24" r="4" fill="#d8dce3"/>
    <text x="58" y="30" fill="#62666f" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="1.2">ATTESTED EXECUTION</text>

    <g transform="translate(24 72)">
      <rect width="164" height="58" rx="9" fill="#f7f7f8" stroke="#d9dce2"/>
      <text x="16" y="23" fill="#62666f" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="700">EMBEDDED</text>
      <text x="16" y="44" fill="#17181a" font-size="16" font-weight="650">Rust model graph</text>
    </g>
    <g transform="translate(216 72)">
      <rect width="164" height="58" rx="9" fill="#f7f7f8" stroke="#d9dce2"/>
      <text x="16" y="23" fill="#62666f" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="700">HOSTED</text>
      <text x="16" y="44" fill="#17181a" font-size="16" font-weight="650">OpenAI API</text>
    </g>

    <path d="M106 130V153H185" fill="none" stroke="#2864e8" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <path d="M298 130V153H219" fill="none" stroke="#2864e8" stroke-width="2" marker-end="url(#arrow-blue)"/>

    <g transform="translate(24 164)">
      <rect width="356" height="112" rx="11" fill="#edf3ff" stroke="#88aaf2" stroke-width="1.5"/>
      <text x="18" y="26" fill="#1f51b8" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="700" letter-spacing="1">ONE RUNTIME BOUNDARY</text>
      <path d="M18 42H338" stroke="#c8d7f8"/>
      <text x="18" y="66" fill="#17181a" font-size="16" font-weight="650">Admission</text>
      <text x="126" y="66" fill="#17181a" font-size="16" font-weight="650">Placement</text>
      <text x="242" y="66" fill="#17181a" font-size="16" font-weight="650">Cancellation</text>
      <text x="18" y="94" fill="#62666f" font-size="14">weights + policy</text>
      <text x="142" y="94" fill="#62666f" font-size="14">CPU / CUDA / Metal</text>
    </g>

    <path d="M202 276V300" fill="none" stroke="#2864e8" stroke-width="2" marker-end="url(#arrow-blue)"/>

    <g transform="translate(24 310)">
      <rect width="218" height="56" rx="9" fill="#ffffff" stroke="#b9ccf7"/>
      <text x="16" y="22" fill="#62666f" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="700">CANONICAL RECEIPT</text>
      <text x="16" y="43" fill="#17181a" font-size="15" font-weight="650">model + policy + I/O digests</text>
    </g>
    <path d="M242 338H265" fill="none" stroke="#14a675" stroke-width="2" marker-end="url(#arrow-green)"/>
    <g transform="translate(276 310)">
      <rect width="104" height="56" rx="9" fill="#ebf8f3" stroke="#8dceb5"/>
      <circle cx="20" cy="28" r="10" fill="#14a675"/>
      <path d="m15 28 4 4 7-9" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="38" y="25" fill="#0b7c56" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" font-weight="700">CLIENT</text>
      <text x="38" y="41" fill="#17181a" font-size="13" font-weight="650">verifies</text>
    </g>

    <g transform="translate(24 397)" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="700">
      <circle cx="5" cy="5" r="5" fill="#14a675"/>
      <text x="18" y="9" fill="#62666f">IDENTITY</text>
      <circle cx="112" cy="5" r="5" fill="#2864e8"/>
      <text x="125" y="9" fill="#62666f">RESOURCES</text>
      <circle cx="236" cy="5" r="5" fill="#62666f"/>
      <text x="249" y="9" fill="#62666f">EVIDENCE</text>
    </g>
  </g>
</svg>
