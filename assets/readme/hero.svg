      <path d="M0 0L10 5L0 10Z" fill="#3ccf91"/>
    </marker>
  </defs>

  <rect width="1200" height="520" rx="24" fill="#101118"/>
  <path d="M40 58H1160" stroke="#2a2d35"/>
  <path d="M664 88V432" stroke="#2a2d35"/>

